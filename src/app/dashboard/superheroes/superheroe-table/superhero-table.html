<div class="table-wrapper">

  <div class="header-actions-bar">
    <h2>Superheroes</h2>
    <button mat-flat-button color="primary" class="primary-button" (click)="addNewHero()">
      + Superhero
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field full-width">
    <mat-label>Search a hero</mat-label>
    <input matInput
           [formControl]="searchControl"
           placeholder="e.g., Spiderman, Superman...">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  @if (loadingService.isLoading()) {
    <mat-progress-bar mode="indeterminate" color="primary" class="loading-bar"></mat-progress-bar>
  }
  <div class="mat-elevation-z4 table-container">
    <table mat-table [dataSource]="paginatedHeroes()" class="mat-table mat-striped">

      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef> Avatar </th>
        <td mat-cell *matCellDef="let hero">
          <img [src]="hero.images.sm" [alt]="hero.name" class="avatar-img mat-elevation-z2">
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let hero" class="font-medium"> {{ hero.name }} </td>
      </ng-container>

      <ng-container matColumnDef="intelligence">
        <th mat-header-cell *matHeaderCellDef> Intelligence </th>
        <td mat-cell *matCellDef="let hero"> {{ hero.powerstats.intelligence }} </td>
      </ng-container>

      <ng-container matColumnDef="power">
        <th mat-header-cell *matHeaderCellDef> Power </th>
        <td mat-cell *matCellDef="let hero"> {{ hero.powerstats.power }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
        <td mat-cell *matCellDef="let hero" class="actions-cell">
          <button mat-icon-button color="accent" matTooltip="View details" aria-label="View hero details" (click)="viewHeroDetails(hero)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" matTooltip="Edit" aria-label="Edit hero" (click)="editHero(hero)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete" aria-label="Delete hero" (click)="deleteHero(hero)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="5">
          No results found
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalHeroes()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
