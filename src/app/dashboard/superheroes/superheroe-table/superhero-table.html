<div class="table-wrapper">

  <div class="header-actions-bar">
    <h2>Superheroes</h2>
    <button mat-flat-button color="primary" class="primary-button" (click)="addNewHero()">
      + Superhero
    </button>
  </div>

<mat-form-field appearance="outline" class="search-field full-width">
  <mat-label>Search a hero</mat-label>
  <input matInput
         (input)="onSearch($any($event.target).value)"
         placeholder="e.g., Spiderman, Superman...">
  <button mat-icon-button matSuffix matTooltip="Search">
    <mat-icon>search</mat-icon>
  </button>
</mat-form-field>


  <div class="mat-elevation-z4 table-container">
    <table mat-table [dataSource]="paginatedHeroes()" class="mat-table mat-striped">

      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef> Avatar </th>
        <td mat-cell *matCellDef="let heroe">
          <img [src]="heroe.images.sm" [alt]="heroe.name" class="avatar-img mat-elevation-z2">
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let heroe" class="font-medium"> {{ heroe.name }} </td>
      </ng-container>

      <ng-container matColumnDef="intelligence">
        <th mat-header-cell *matHeaderCellDef> Intelligence </th>
        <td mat-cell *matCellDef="let heroe"> {{ heroe.powerstats.intelligence }} </td>
      </ng-container>

      <ng-container matColumnDef="power">
        <th mat-header-cell *matHeaderCellDef> Power </th>
        <td mat-cell *matCellDef="let heroe"> {{ heroe.powerstats.power }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
        <td mat-cell *matCellDef="let heroe" class="actions-cell">
          <button mat-icon-button color="accent" matTooltip="View details">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button color="primary" matTooltip="Edit" (click)="editHero(heroe)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete" (click)="deleteHero(heroe)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="5">
          No results found
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalHeroes()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="onPageChange($event)"
      showFirstLastButtons>
    </mat-paginator>
  </div>
</div>
