<div class="table-wrapper">

    <div class="mat-elevation-z2 table-container">
    <table mat-table [dataSource]="pagedHeroes()">

      <ng-container matColumnDef="avatar">
        <th mat-header-cell *matHeaderCellDef> Avatar </th>
        <td mat-cell *matCellDef="let element"> 
          <img [src]="element.images.sm" [alt]="element.name" class="avatar-img">
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element" class="font-medium"> {{ element.name }} </td>
      </ng-container>

      <ng-container matColumnDef="intelligence">
        <th mat-header-cell *matHeaderCellDef> Intelligence </th>
        <td mat-cell *matCellDef="let element"> {{ element.powerstats.intelligence }} </td>
      </ng-container>

      <ng-container matColumnDef="power">
        <th mat-header-cell *matHeaderCellDef> Power </th>
        <td mat-cell *matCellDef="let element"> {{ element.powerstats.power }} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-header"> Actions </th>
        <td mat-cell *matCellDef="let element" class="actions-cell">
          <button mat-icon-button color="primary" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="5">
          No results found
        </td>
      </tr>
    </table>
  </div>
</div>
